<aside class="sidebar">
  <h3 class="sidebar-toggle">All Posts <span class="toggle-icon">▼</span></h3>
  <ul class="sidebar-posts">
    {{ range where .Site.RegularPages "Section" "posts" }}
    <li>
      <a href="{{ .Permalink }}">{{ .Title }}</a>
      <span class="sidebar-date">{{ .Date.Format "Jan 2, 2006" }}</span>
    </li>
    {{ end }}
  </ul>
</aside>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const toggle = document.querySelector('.sidebar-toggle');
  const posts = document.querySelector('.sidebar-posts');
  if (toggle && posts && window.innerWidth <= 768) {
    posts.classList.add('collapsed');
    toggle.addEventListener('click', function() {
      posts.classList.toggle('collapsed');
      toggle.classList.toggle('expanded');
    });
  }
});
</script>
